<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="title desc"><title id="title">Physical AI Foundations project map</title><desc id="desc">Foundations lead to arm control and ROS systems, then manipulation learning and controlled retention experiments. Current work uses state observations in simulation.</desc><rect width="1100" height="280" rx="18" fill="#f2f6f3"/><text x="32" y="45" font-family="sans-serif" font-size="22" fill="#153c3b" font-weight="bold">From physical models to measured robot-learning behavior</text><g font-family="sans-serif" font-size="18" fill="#153c3b"><rect x="30" y="80" width="230" height="130" rx="12" fill="white"/><text x="48" y="112" font-weight="bold">Foundations</text><text x="48" y="143">Frames · SE(3) · MuJoCo</text><text x="48" y="173">Pendulum · PD control</text><rect x="300" y="80" width="230" height="130" rx="12" fill="white"/><text x="318" y="112" font-weight="bold">Arm &amp; ROS systems</text><text x="318" y="143">FK · IK · Jacobian · DLS</text><text x="318" y="173">Commands · telemetry · bags</text><rect x="570" y="80" width="230" height="130" rx="12" fill="white"/><text x="588" y="112" font-weight="bold">Robot learning</text><text x="588" y="143">PushCube · PickCube</text><text x="588" y="173">Behavior cloning · PPO</text><rect x="840" y="80" width="230" height="130" rx="12" fill="#153c3b"/><text x="858" y="112" font-weight="bold" fill="white">Current investigation</text><text x="858" y="143" fill="white">Precision placement</text><text x="858" y="173" fill="white">Policy retention</text></g><path d="M265 145h29m-8-7 8 7-8 7m249-7h29m-8-7 8 7-8 7m249-7h29m-8-7 8 7-8 7" stroke="#59877c" fill="none" stroke-width="3"/><text x="32" y="249" font-family="sans-serif" font-size="16" fill="#53665d">State-based simulation · native rollout evidence · controlled comparisons · unresolved limits reported</text></svg>
